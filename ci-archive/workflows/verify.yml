name: Verify references
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    if: ${{ vars.PATCHED_MACOS_ACTIONS_ENABLED == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, macOS, ARM64, patched-macos-01]
    timeout-minutes: 15
    steps:
      - name: Confirm approved macOS runner
        run: |
          test "$RUNNER_NAME" = patched-macos-01
          test "$RUNNER_OS" = macOS
          test "$RUNNER_ARCH" = ARM64
          test "$(id -u)" -ne 0
          printf 'Runner: %s\nCommit: %s\n' "$RUNNER_NAME" "$GITHUB_SHA"
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Verify with at most two Swift jobs
        shell: bash
        run: |
          set -euo pipefail
          swift_shim="$(mktemp -d "$RUNNER_TEMP/patched-swift-XXXXXX")"
          trap 'rm -f "$swift_shim/swift"; rmdir "$swift_shim"' EXIT
          cat > "$swift_shim/swift" <<'SH'
          #!/bin/bash
          set -eu
          case "${1:-}" in
            build|run)
              verb="$1"; shift
              for argument in "$@"; do
                case "$argument" in
                  --jobs|--jobs=*|-j|-j[0-9]*) echo 'Swift job overrides are not allowed in CI' >&2; exit 64;;
                esac
              done
              exec /usr/bin/swift "$verb" --jobs 2 "$@";;
            *) exec /usr/bin/swift "$@";;
          esac
          SH
          chmod 700 "$swift_shim/swift"
          PATH="$swift_shim:$PATH" ./scripts/verify.sh
